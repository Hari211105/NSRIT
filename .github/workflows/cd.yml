name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-backend:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL configured, skipping deployment."
            exit 0
          fi
          echo "CI passed on main. Triggering automated backend redeployment on Render..."
          curl -s -S -X POST "${RENDER_DEPLOY_HOOK_URL}" > /dev/null
          echo "Deploy webhook triggered successfully."
