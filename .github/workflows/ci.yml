name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Testing Job
  # ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Pytest test suite
        working-directory: backend
        env:
          ENVIRONMENT: "testing"
          JWT_SECRET_KEY: "test-jwt-secret-key-for-continuous-integration-run"
        run: |
          python -m pytest -v

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Build Job
  # ─────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend distribution
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "/api/v1"
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 3. Docker Container Build Verification
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Backend Docker Image Verification
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker container (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: upskill-ai-backend:test
